name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Validate interop v0.1 vectors
        run: npm run example:interop-v0.1

      - name: Validate JavaScript interop v0.2 vectors
        run: npm run example:interop-v0.2

      - name: Install pinned Python interop v0.2 dependencies
        run: python3 -m pip install -r examples/python-interop-v0.2/requirements.txt

      - name: Validate Python interop v0.2 vectors
        run: npm run example:python-interop-v0.2

      - name: Validate interop v0.2 cross-language signatures
        run: npm run example:interop-v0.2:cross

      - name: Validate Code Engine reverse fixtures
        run: npm run example:interop-code-engine

      - name: Validate proof kit
        run: npm run example:proof-kit

      - name: Validate receipt chain
        run: |
          npm run reset:demo
          npm run demo
          npm run chain

      - name: Run tests
        run: npm test

      - name: Pack and install public package
        run: npm run check:package

      - name: Check diff
        run: git diff --check
